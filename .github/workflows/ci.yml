name: Validate upgrade
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r backend/requirements-dev.txt
      - run: python backend/install_tlc.py
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uml2tla-test .
      - run: docker run -d --name uml2tla-smoke -p 127.0.0.1:8000:8000 uml2tla-test
      - run: python scripts/check_container.py
      - if: always()
        run: |
          docker logs uml2tla-smoke || true
          docker rm -f uml2tla-smoke || true
